name = "gekko_json"
version = "0.1.0"
description = "MoonBit/gekko companion shim overlay for upstream gleam_json"
licences = ["MIT"]
repository = { type = "github", user = "spiral-nights", repo = "gekko_json" }

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.0.0 and < 4.0.0"
gekko_stdlib = { git = "https://github.com/spiral-nights/gekko_stdlib.git", ref = "main" }

[tools.gekko.shim_for]
package = "gleam_json"
version = ">= 3.0.0 and < 4.0.0"

[tools.gekko.use_shims]
gleam_stdlib = "gekko_stdlib"

[tools.gekko.type_overrides."gleam_json:gleam/json.Json"]
package = "moonbitlang/core/json"
type = "Json"
