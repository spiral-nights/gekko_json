[shim]
target = "gleam_json"
version = ">= 3.0.0 and < 4.0.0"

[patch."gleam_json:gleam/json"]
file = "patches/gleam/json.mbt"
imports = ["moonbitlang/core/json", "moonbitlang/core/string as str"]
types = ["Json"]
functions = [
  "decode_string",
  "to_string_tree",
  "do_to_string",
  "do_string",
  "do_bool",
  "do_int",
  "do_float",
  "do_null",
  "do_object",
  "do_preprocessed_array",
]
